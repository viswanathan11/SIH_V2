version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidyasetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidyasetu
      POSTGRES_USER: vidyasetu
      POSTGRES_PASSWORD: vidyasetu_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyasetu -d vidyasetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidyasetu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vidyasetu
      SPRING_DATASOURCE_USERNAME: vidyasetu
      SPRING_DATASOURCE_PASSWORD: vidyasetu_dev_password
      APP_DEMO_MODE: "true"
      APP_SEED_ON_STARTUP: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidyasetu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
